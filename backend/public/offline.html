<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#064e3b">
    <title>Sin conexión · AcopiaApp</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f4f6;
            color: #111827;
        }
        .tarjeta {
            max-width: 26rem;
            width: 100%;
            background: #ffffff;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5e7eb;
        }
        .icono {
            width: 3.5rem;
            height: 3.5rem;
            margin: 0 auto 1rem;
            border-radius: 9999px;
            background: #ecfdf5;
            color: #047857;
            display: grid;
            place-items: center;
            font-size: 1.75rem;
        }
        h1 { margin: 0 0 0.5rem; font-size: 1.25rem; color: #064e3b; }
        p { margin: 0 0 1.5rem; font-size: 0.95rem; line-height: 1.5; color: #4b5563; }
        .boton {
            display: inline-block;
            border: 0;
            border-radius: 0.5rem;
            background: #047857;
            color: #ffffff;
            padding: 0.65rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .boton:hover { background: #065f46; }
    </style>
</head>
<body>
    <main class="tarjeta">
        <div class="icono" aria-hidden="true">📡</div>
        <h1>Estás sin conexión a internet</h1>
        <p>
            Esta pantalla aún no está guardada en tu dispositivo. Verifica tu conexión e inténtalo de nuevo para continuar operando en AcopiaApp.
        </p>
        <button type="button" class="boton" onclick="window.location.reload()">Reintentar</button>
    </main>
</body>
</html>
